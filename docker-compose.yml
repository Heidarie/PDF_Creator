services:
  pdfactory:
    build: .
    image: pdfactory:local
    ports:
      - "8080:8080"
    environment:
      CHROME_NO_SANDBOX: "true"
    # Uncomment if you add app logic that talks to Redis.
    # depends_on:
    #   - redis

  # Optional: Redis for future expansion
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["infra"]
