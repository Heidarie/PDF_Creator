name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Test main service
        run: go test ./...

      - name: Lint main service
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.56.2
          args: --timeout=5m ./...

      - name: Test pdfactory-go module
        run: |
          cd pdfactory-go
          go test ./...

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Test .NET client/builders
        run: |
          dotnet test pdfactory-dotnet/tests/PdfFactory.Client.Tests/PdfFactory.Client.Tests.csproj
          dotnet test pdfactory-dotnet/tests/PdfFactory.Builders.Tests/PdfFactory.Builders.Tests.csproj

      - name: Integration tests (Docker)
        run: bash scripts/integration-test.sh
